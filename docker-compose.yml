services:
  mediamanager:
    image: ghcr.io/compactly8274/upgrademedia:latest
    ports:
      - "8000:8000"
    volumes:
      - mediamanager-data:/data
      # Mount your actual media directories so the scanner can read files directly.
      # Use the same paths in MEDIA_PATHS below.
      # Tip: read-only (:ro) is fine for scanning; remove :ro if you want stream stripping to work.
      # - /your/path/movies:/movies
      # - /your/path/tv:/tv
      # - /your/path/4k:/4k
    environment:
      RADARR_URL: http://192.168.1.x:7878
      RADARR_API_KEY: ""
      SONARR_URL: http://192.168.1.x:8989
      SONARR_API_KEY: ""
      PLEX_URL: http://192.168.1.x:32400
      PLEX_TOKEN: ""
      QUALITY_THRESHOLD: "60"
      MIN_SIZE_GB: "0.5"
      MIN_DAYS_STALE: "90"
      # Comma-separated paths the scanner walks. Must match the container-side mount paths above.
      # The scanner reads files directly — Radarr/Sonarr are optional (only used to enable the
      # per-file Search button). Leave Radarr/Sonarr blank and scanning still works.
      # Example: MEDIA_PATHS: "/movies,/tv,/4k"
      MEDIA_PATHS: ""
      # Webhook notifications (optional):
      WEBHOOK_URL: ""
      WEBHOOK_TYPE: "discord"
    restart: unless-stopped

volumes:
  mediamanager-data:
