services:
  mediamanager:
    image: ghcr.io/compactly8274/upgrademedia:latest
    ports:
      - "8000:8000"
    volumes:
      - mediamanager-data:/data
      # Mount your media directories (read-only for scanning, read-write for stream stripping):
      # - /your/movies:/movies
      # - /your/tv:/tv
    environment:
      RADARR_URL: http://192.168.1.x:7878
      RADARR_API_KEY: ""
      SONARR_URL: http://192.168.1.x:8989
      SONARR_API_KEY: ""
      PLEX_URL: http://192.168.1.x:32400
      PLEX_TOKEN: ""
      QUALITY_THRESHOLD: "60"
      MIN_SIZE_GB: "0.5"
      MIN_DAYS_STALE: "90"
      # Comma-separated paths to scan for media files (must match volume mounts above):
      MEDIA_PATHS: ""
      # Webhook notifications (Discord, Ntfy, Gotify, or generic JSON):
      WEBHOOK_URL: ""
      WEBHOOK_TYPE: "discord"
    restart: unless-stopped

volumes:
  mediamanager-data:
